openapi: 3.1.0
info:
  title: SchemaWise API
  version: 1.0.0
  description: HTTP contract v1 for synchronous normalization analysis, authentication, and authenticated owner-scoped project persistence. This describes the HTTP contract, not the engine package version.
tags:
  - { name: Operations, description: Unauthenticated process liveness and PostgreSQL readiness probes; separate from computational behavior. }
  - { name: Auth, description: Server-side opaque session authentication with session-bound CSRF, credentialed CORS, and auth-specific rate limits. }
  - { name: Projects, description: Authenticated owner-scoped project snapshots with optimistic concurrency control. }
  - { name: Computation, description: Public stateless normalization computations. }
paths:
  /health:
    get:
      tags: [Operations]
      operationId: getHealth
      security: []
      responses:
        '200': { $ref: '#/components/responses/HealthSuccess' }
  /ready:
    get:
      tags: [Operations]
      operationId: getReadiness
      security: []
      responses:
        '200': { $ref: '#/components/responses/ReadinessSuccess' }
        '503': { $ref: '#/components/responses/ReadinessUnavailable' }
  /api/v1/auth/register:
    post:
      tags: [Auth]
      operationId: registerUser
      requestBody: { $ref: '#/components/requestBodies/AuthRequest' }
      responses:
        '201': { $ref: '#/components/responses/AuthCreated' }
        '400': { $ref: '#/components/responses/AuthBadRequest' }
        '403': { $ref: '#/components/responses/AuthForbidden' }
        '409': { $ref: '#/components/responses/AuthConflict' }
        '429': { $ref: '#/components/responses/AuthRateLimited' }
        '500': { $ref: '#/components/responses/AuthInternalError' }
  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: loginUser
      requestBody: { $ref: '#/components/requestBodies/AuthRequest' }
      responses:
        '200': { $ref: '#/components/responses/AuthLoginSuccess' }
        '400': { $ref: '#/components/responses/AuthBadRequest' }
        '401': { $ref: '#/components/responses/AuthUnauthorized' }
        '403': { $ref: '#/components/responses/AuthForbidden' }
        '429': { $ref: '#/components/responses/AuthRateLimited' }
        '500': { $ref: '#/components/responses/AuthInternalError' }
  /api/v1/auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      security: [{ sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/AuthSuccess' }
        '401': { $ref: '#/components/responses/AuthUnauthenticated' }
        '500': { $ref: '#/components/responses/AuthInternalError' }
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logoutUser
      description: A valid session requires exact browser provenance when supplied and a matching X-CSRF-Token. Missing or inactive sessions remain idempotent.
      security: [{ sessionCookie: [] }, {}]
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      responses:
        '204': { description: Session revoked when present and cookie cleared idempotently. }
        '403': { $ref: '#/components/responses/AuthForbidden' }
        '500': { $ref: '#/components/responses/AuthInternalError' }
  /api/v1/projects:
    post:
      tags: [Projects]
      operationId: createProject
      description: Creates revision 1 for the authenticated user. Browser provenance and the session-bound CSRF token are required.
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectCsrfHeader' }]
      requestBody: { $ref: '#/components/requestBodies/CreateProject' }
      responses:
        '201': { $ref: '#/components/responses/ProjectCreated' }
        '400': { $ref: '#/components/responses/ProjectBadRequest' }
        '401': { $ref: '#/components/responses/AuthUnauthenticated' }
        '403': { $ref: '#/components/responses/AuthForbidden' }
        '413': { $ref: '#/components/responses/ProjectPayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ProjectLimitExceeded' }
        '500': { $ref: '#/components/responses/ProjectInternalError' }
    get:
      tags: [Projects]
      operationId: listProjects
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/ProjectLimit' }
        - { $ref: '#/components/parameters/ProjectOffset' }
      responses:
        '200': { $ref: '#/components/responses/ProjectListSuccess' }
        '400': { $ref: '#/components/responses/ProjectBadRequest' }
        '401': { $ref: '#/components/responses/AuthUnauthenticated' }
        '422': { $ref: '#/components/responses/ProjectLimitExceeded' }
        '500': { $ref: '#/components/responses/ProjectInternalError' }
  /api/v1/projects/{projectId}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
    get:
      tags: [Projects]
      operationId: getProject
      security: [{ sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/ProjectSuccess' }
        '400': { $ref: '#/components/responses/ProjectBadRequest' }
        '401': { $ref: '#/components/responses/AuthUnauthenticated' }
        '404': { $ref: '#/components/responses/ProjectNotFound' }
        '500': { $ref: '#/components/responses/ProjectInternalError' }
    put:
      tags: [Projects]
      operationId: updateProject
      description: Replaces the complete project name/schema when expectedRevision matches. Browser provenance and the session-bound CSRF token are required.
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectCsrfHeader' }]
      requestBody: { $ref: '#/components/requestBodies/UpdateProject' }
      responses:
        '200': { $ref: '#/components/responses/ProjectSuccess' }
        '400': { $ref: '#/components/responses/ProjectBadRequest' }
        '401': { $ref: '#/components/responses/AuthUnauthenticated' }
        '403': { $ref: '#/components/responses/AuthForbidden' }
        '404': { $ref: '#/components/responses/ProjectNotFound' }
        '409': { $ref: '#/components/responses/ProjectConflict' }
        '413': { $ref: '#/components/responses/ProjectPayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ProjectLimitExceeded' }
        '500': { $ref: '#/components/responses/ProjectInternalError' }
    delete:
      tags: [Projects]
      operationId: deleteProject
      description: Hard-deletes an owned project. Browser provenance and the session-bound CSRF token are required.
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectCsrfHeader' }]
      responses:
        '204': { description: Project deleted; response has no body. }
        '400': { $ref: '#/components/responses/ProjectBadRequest' }
        '401': { $ref: '#/components/responses/AuthUnauthenticated' }
        '403': { $ref: '#/components/responses/AuthForbidden' }
        '404': { $ref: '#/components/responses/ProjectNotFound' }
        '500': { $ref: '#/components/responses/ProjectInternalError' }
  /api/v1/analysis:
    post:
      tags: [Computation]
      operationId: analyzeSchema
      requestBody: { $ref: '#/components/requestBodies/SchemaInput' }
      responses: { '200': { $ref: '#/components/responses/AnalysisResponse' }, '400': { $ref: '#/components/responses/BadRequest' }, '413': { $ref: '#/components/responses/PayloadTooLarge' }, '415': { $ref: '#/components/responses/UnsupportedMediaType' }, '422': { $ref: '#/components/responses/LimitExceeded' }, '500': { $ref: '#/components/responses/InternalError' } }
  /api/v1/closure:
    post:
      tags: [Computation]
      operationId: calculateClosure
      requestBody: { $ref: '#/components/requestBodies/ClosureRequest' }
      responses: { '200': { $ref: '#/components/responses/ClosureResponse' }, '400': { $ref: '#/components/responses/BadRequest' }, '413': { $ref: '#/components/responses/PayloadTooLarge' }, '415': { $ref: '#/components/responses/UnsupportedMediaType' }, '422': { $ref: '#/components/responses/LimitExceeded' }, '500': { $ref: '#/components/responses/InternalError' } }
  /api/v1/synthesis/3nf:
    post:
      tags: [Computation]
      operationId: synthesizeThirdNormalForm
      requestBody: { $ref: '#/components/requestBodies/SchemaInput' }
      responses: { '200': { $ref: '#/components/responses/SynthesisResponse' }, '400': { $ref: '#/components/responses/BadRequest' }, '413': { $ref: '#/components/responses/PayloadTooLarge' }, '415': { $ref: '#/components/responses/UnsupportedMediaType' }, '422': { $ref: '#/components/responses/LimitExceeded' }, '500': { $ref: '#/components/responses/InternalError' } }
  /api/v1/decomposition/bcnf:
    post:
      tags: [Computation]
      operationId: decomposeBoyceCodd
      requestBody: { $ref: '#/components/requestBodies/SchemaInput' }
      responses: { '200': { $ref: '#/components/responses/BcnfResponse' }, '400': { $ref: '#/components/responses/BadRequest' }, '413': { $ref: '#/components/responses/PayloadTooLarge' }, '415': { $ref: '#/components/responses/UnsupportedMediaType' }, '422': { $ref: '#/components/responses/LimitExceeded' }, '500': { $ref: '#/components/responses/InternalError' } }
  /api/v1/analysis/dependency-preservation:
    post:
      tags: [Computation]
      operationId: analyzeDependencyPreservation
      requestBody: { $ref: '#/components/requestBodies/DependencyPreservationRequest' }
      responses: { '200': { $ref: '#/components/responses/DependencyPreservationResponse' }, '400': { $ref: '#/components/responses/BadRequest' }, '413': { $ref: '#/components/responses/PayloadTooLarge' }, '415': { $ref: '#/components/responses/UnsupportedMediaType' }, '422': { $ref: '#/components/responses/LimitExceeded' }, '500': { $ref: '#/components/responses/InternalError' }, 'default': { description: OPERATION_TIMEOUT status is selected by the future execution adapter; no status is frozen in v1., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } } }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: schemawise_session
      description: Opaque 256-bit session token. The server stores only its SHA-256 digest.
  parameters:
    CsrfHeader:
      name: X-CSRF-Token
      in: header
      required: false
      description: Required when logout presents an active session; value returned by register, login, or me for that same session.
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
    ProjectCsrfHeader:
      name: X-CSRF-Token
      in: header
      required: true
      description: HMAC token returned for the same active session; required on every project mutation even when Origin and Referer are absent.
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
    ProjectId:
      name: projectId
      in: path
      required: true
      description: Server-generated UUID v4. A malformed value returns 400 INVALID_PROJECT before persistence.
      schema: { type: string, format: uuid, pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$' }
    ProjectLimit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    ProjectOffset:
      name: offset
      in: query
      required: false
      schema: { type: integer, minimum: 0, default: 0 }
  requestBodies:
    AuthRequest:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/AuthRequestDto' } } }
    CreateProject:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/CreateProjectRequestDto' } } }
    UpdateProject:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/UpdateProjectRequestDto' } } }
    SchemaInput:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/SchemaInputDto' } } }
    ClosureRequest:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/ClosureRequestDto' } } }
    DependencyPreservationRequest:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/DependencyPreservationRequestDto' } } }
  responses:
    HealthSuccess: { description: The HTTP process is accepting requests; this probe does not access PostgreSQL., content: { application/json: { schema: { $ref: '#/components/schemas/HealthResponse' } } } }
    ReadinessSuccess: { description: The API completed a minimal PostgreSQL SELECT 1 check., content: { application/json: { schema: { $ref: '#/components/schemas/ReadinessResponse' } } } }
    ReadinessUnavailable: { description: PostgreSQL readiness failed; no database or connection details are exposed., content: { application/json: { schema: { $ref: '#/components/schemas/NotReadyResponse' } } } }
    AuthCreated:
      description: User registered and signed in. The raw session token is returned only in Set-Cookie; the session-bound CSRF token is in the JSON response.
      headers: { Set-Cookie: { schema: { type: string }, description: 'schemawise_session with HttpOnly, Path=/, SameSite=Lax, Max-Age=2592000, Expires, and environment-configured Secure.' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponseDto' } } }
    AuthSuccess:
      description: Authentication succeeded; me returns the stable CSRF token for the active session without replacing its cookie.
      content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponseDto' } } }
    AuthLoginSuccess:
      description: Authentication succeeded with a new independent session and CSRF token. The raw session token is returned only in Set-Cookie.
      headers: { Set-Cookie: { schema: { type: string }, description: 'schemawise_session with HttpOnly, Path=/, SameSite=Lax, Max-Age=2592000, Expires, and environment-configured Secure.' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponseDto' } } }
    AuthBadRequest: { description: Invalid authentication DTO or input policy, content: { application/json: { schema: { $ref: '#/components/schemas/AuthErrorEnvelope' } } } }
    AuthUnauthorized: { description: Invalid credentials, content: { application/json: { schema: { $ref: '#/components/schemas/AuthErrorEnvelope' } } } }
    AuthUnauthenticated: { description: Missing or inactive session; an invalid presented cookie is cleared, content: { application/json: { schema: { $ref: '#/components/schemas/AuthErrorEnvelope' } } } }
    AuthConflict: { description: Canonical email already exists, content: { application/json: { schema: { $ref: '#/components/schemas/AuthErrorEnvelope' } } } }
    AuthForbidden: { description: Browser provenance or session-bound CSRF validation failed with INVALID_CSRF_TOKEN, content: { application/json: { schema: { $ref: '#/components/schemas/AuthErrorEnvelope' } } } }
    AuthRateLimited:
      description: An authentication attempt exceeded an applicable IP or email-and-IP limit; the bucket is not disclosed.
      headers: { Retry-After: { schema: { type: integer, minimum: 1 }, description: Seconds until this request can be retried. } }
      content: { application/json: { schema: { $ref: '#/components/schemas/AuthErrorEnvelope' } } }
    AuthInternalError: { description: Sanitized authentication infrastructure failure, content: { application/json: { schema: { $ref: '#/components/schemas/AuthErrorEnvelope' } } } }
    ProjectCreated: { description: Project created at revision 1, content: { application/json: { schema: { $ref: '#/components/schemas/ProjectResponseDto' } } } }
    ProjectSuccess: { description: Owned project snapshot, content: { application/json: { schema: { $ref: '#/components/schemas/ProjectResponseDto' } } } }
    ProjectListSuccess: { description: Compact summaries and exact owner-scoped total, content: { application/json: { schema: { $ref: '#/components/schemas/ProjectListResponseDto' } } } }
    ProjectBadRequest: { description: Invalid project DTO, pagination, or project identifier, content: { application/json: { schema: { $ref: '#/components/schemas/ProjectErrorEnvelope' } } } }
    ProjectNotFound: { description: Project is missing or belongs to another user; both cases are indistinguishable, content: { application/json: { schema: { $ref: '#/components/schemas/ProjectErrorEnvelope' } } } }
    ProjectConflict: { description: The owned project revision no longer matches expectedRevision, content: { application/json: { schema: { $ref: '#/components/schemas/ProjectErrorEnvelope' } } } }
    ProjectPayloadTooLarge: { description: Project request payload exceeds the global 64 KiB limit, content: { application/json: { schema: { $ref: '#/components/schemas/ProjectErrorEnvelope' } } } }
    ProjectLimitExceeded: { description: A documented project draft or list limit was exceeded, content: { application/json: { schema: { $ref: '#/components/schemas/ProjectErrorEnvelope' } } } }
    ProjectInternalError: { description: Sanitized project persistence failure, content: { application/json: { schema: { $ref: '#/components/schemas/ProjectErrorEnvelope' } } } }
    AnalysisResponse: { description: Successful analysis, content: { application/json: { schema: { $ref: '#/components/schemas/AnalysisResponseDto' } } } }
    ClosureResponse: { description: Successful closure, content: { application/json: { schema: { $ref: '#/components/schemas/ClosureResponseDto' } } } }
    SynthesisResponse: { description: Successful 3NF synthesis, content: { application/json: { schema: { $ref: '#/components/schemas/ThirdNormalFormSynthesisResponseDto' } } } }
    BcnfResponse: { description: Successful BCNF decomposition, content: { application/json: { schema: { $ref: '#/components/schemas/BcnfDecompositionResponseDto' } } } }
    DependencyPreservationResponse: { description: Successful dependency preservation analysis, content: { application/json: { schema: { $ref: '#/components/schemas/DependencyPreservationResponseDto' } } } }
    BadRequest: { description: Invalid request or scope, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
    PayloadTooLarge: { description: Payload exceeds 64 KiB; the future HTTP adapter returns ANALYSIS_LIMIT_EXCEEDED, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
    UnsupportedMediaType: { description: Unsupported media type; the future HTTP adapter returns INVALID_REQUEST, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
    LimitExceeded: { description: Product limit exceeded (cardinality/length uses 422; payload bytes uses 413 in the future HTTP adapter), content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
    InternalError: { description: Internal error, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  schemas:
    HealthResponse: { type: object, required: [status], additionalProperties: false, properties: { status: { type: string, const: ok } } }
    ReadinessResponse: { type: object, required: [status], additionalProperties: false, properties: { status: { type: string, const: ready } } }
    NotReadyResponse: { type: object, required: [status], additionalProperties: false, properties: { status: { type: string, const: not-ready } } }
    AuthRequestDto:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: { type: string, maxLength: 254 }
        password: { type: string, maxLength: 128, description: Registration requires at least 12 Unicode code points; login permits historical shorter values. }
    PublicUserDto:
      type: object
      required: [id, email]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        email: { type: string, maxLength: 254 }
    AuthResponseDto:
      type: object
      required: [user, csrfToken]
      additionalProperties: false
      properties:
        user: { $ref: '#/components/schemas/PublicUserDto' }
        csrfToken: { type: string, pattern: '^[A-Za-z0-9_-]{43}$', description: HMAC-SHA-256 value bound to the current session; keep in memory and send as X-CSRF-Token on authenticated mutations. }
    AuthErrorCode: { type: string, enum: [INVALID_AUTH_REQUEST, EMAIL_ALREADY_EXISTS, INVALID_CREDENTIALS, UNAUTHENTICATED, INVALID_CSRF_TOKEN, AUTH_RATE_LIMITED, AUTH_INTERNAL_ERROR] }
    AuthErrorEnvelope: { type: object, required: [error], properties: { error: { type: object, required: [code, message], properties: { code: { $ref: '#/components/schemas/AuthErrorCode' }, message: { type: string }, details: { type: object, additionalProperties: true } } } } }
    ProjectAttributeDto:
      type: object
      required: [id, name]
      additionalProperties: false
      properties:
        id: { type: string, minLength: 1, maxLength: 64 }
        name: { type: string, maxLength: 120 }
    ProjectRelationDto:
      type: object
      required: [name, attributes]
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 120 }
        attributes: { type: array, maxItems: 6, items: { $ref: '#/components/schemas/ProjectAttributeDto' } }
    ProjectFunctionalDependencyDto:
      type: object
      required: [left, right]
      additionalProperties: false
      properties:
        left: { type: array, items: { type: string }, uniqueItems: true }
        right: { type: array, items: { type: string }, uniqueItems: true }
    PersistedProjectSchemaDto:
      type: object
      required: [schemaVersion, relation, functionalDependencies]
      additionalProperties: false
      properties:
        schemaVersion: { type: integer, const: 1 }
        relation: { $ref: '#/components/schemas/ProjectRelationDto' }
        functionalDependencies: { type: array, maxItems: 12, items: { $ref: '#/components/schemas/ProjectFunctionalDependencyDto' } }
    CreateProjectRequestDto:
      type: object
      required: [name, schema]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        schema: { $ref: '#/components/schemas/PersistedProjectSchemaDto' }
    UpdateProjectRequestDto:
      type: object
      required: [name, schema, expectedRevision]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        schema: { $ref: '#/components/schemas/PersistedProjectSchemaDto' }
        expectedRevision: { type: integer, minimum: 1 }
    ProjectDto:
      type: object
      required: [id, name, schema, revision, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        schema: { $ref: '#/components/schemas/PersistedProjectSchemaDto' }
        revision: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ProjectResponseDto:
      type: object
      required: [project]
      additionalProperties: false
      properties: { project: { $ref: '#/components/schemas/ProjectDto' } }
    ProjectSummaryDto:
      type: object
      required: [id, name, relationName, attributeCount, functionalDependencyCount, revision, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        relationName: { type: string }
        attributeCount: { type: integer, minimum: 0 }
        functionalDependencyCount: { type: integer, minimum: 0 }
        revision: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ProjectListResponseDto:
      type: object
      required: [projects, total, limit, offset]
      additionalProperties: false
      properties:
        projects: { type: array, items: { $ref: '#/components/schemas/ProjectSummaryDto' } }
        total: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1, maximum: 100 }
        offset: { type: integer, minimum: 0 }
    ProjectErrorCode: { type: string, enum: [INVALID_PROJECT, PROJECT_NOT_FOUND, PROJECT_REVISION_CONFLICT, PROJECT_LIMIT_EXCEEDED, PERSISTENCE_ERROR] }
    ProjectErrorEnvelope: { type: object, required: [error], properties: { error: { type: object, required: [code, message], properties: { code: { $ref: '#/components/schemas/ProjectErrorCode' }, message: { type: string }, details: { type: object, additionalProperties: true } } } } }
    AttributeDto:
      type: object
      required: [id, name]
      additionalProperties: false
      properties:
        id: { type: string, minLength: 1, maxLength: 64 }
        name: { type: string, minLength: 1, maxLength: 120 }
      description: IDs are case-sensitive and stable per request; uniqueness is validated by Application Layer.
    AttributeSetDto: { type: array, items: { type: string }, uniqueItems: true, description: An attribute ID set; the empty array is valid. }
    RelationDto:
      type: object
      required: [name, attributes]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        attributes: { type: array, minItems: 1, maxItems: 6, items: { $ref: '#/components/schemas/AttributeDto' } }
    FunctionalDependencyDto:
      type: object
      required: [left, right]
      additionalProperties: false
      properties: { left: { $ref: '#/components/schemas/AttributeSetDto' }, right: { $ref: '#/components/schemas/AttributeSetDto' } }
    SchemaInputDto:
      type: object
      required: [relation, functionalDependencies]
      additionalProperties: false
      properties:
        relation: { $ref: '#/components/schemas/RelationDto' }
        functionalDependencies: { type: array, maxItems: 12, items: { $ref: '#/components/schemas/FunctionalDependencyDto' } }
    ClosureRequestDto:
      allOf:
        - { $ref: '#/components/schemas/SchemaInputDto' }
        - type: object
          required: [attributes]
          properties: { attributes: { $ref: '#/components/schemas/AttributeSetDto' } }
    DependencyPreservationRequestDto:
      allOf:
        - { $ref: '#/components/schemas/SchemaInputDto' }
        - type: object
          required: [decomposition]
          properties: { decomposition: { type: array, maxItems: 12, items: { $ref: '#/components/schemas/AttributeSetDto' } } }
    AnalysisResponseDto:
      type: object
      required: [relation, candidateKeys, primeAttributes, minimalCover, normalForms]
      properties:
        relation: { $ref: '#/components/schemas/RelationDto' }
        candidateKeys: { type: array, items: { $ref: '#/components/schemas/AttributeSetDto' } }
        primeAttributes: { $ref: '#/components/schemas/AttributeSetDto' }
