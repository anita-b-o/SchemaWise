<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SchemaWise Open Graph image source</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
      }
      body {
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: #fff;
        background: #073f37;
      }
      main {
        position: relative;
        display: grid;
        grid-template-columns: 47% 53%;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      .copy {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 68px 54px 52px 64px;
        background: linear-gradient(132deg, #073f37 0%, #0b6758 100%);
      }
      .eyebrow {
        margin: 0 0 22px;
        color: #a9e3d9;
        font-size: 18px;
        font-weight: 750;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        font-size: 72px;
        line-height: 0.98;
        letter-spacing: -0.055em;
      }
      .value {
        max-width: 470px;
        margin: 28px 0 0;
        color: #edf8f5;
        font-size: 27px;
        line-height: 1.27;
      }
      .footer {
        margin: 0;
        color: #bfe9e1;
        font-size: 18px;
        font-weight: 650;
      }
      .product {
        position: relative;
        display: flex;
        align-items: center;
        padding-left: 12px;
        background: #f4f3ef;
        overflow: hidden;
      }
      .browser {
        width: 760px;
        height: 500px;
        overflow: hidden;
        border: 1px solid #b9bfbb;
        border-radius: 10px 0 0 10px;
        background: #fff;
        box-shadow: 0 24px 60px rgba(5, 34, 30, 0.28);
      }
      .bar {
        display: flex;
        align-items: center;
        gap: 9px;
        height: 38px;
        padding: 0 15px;
        background: #e8e9e5;
        border-bottom: 1px solid #cfd1cb;
      }
      .bar span {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: #9aa39f;
      }
      .browser img {
        display: block;
        width: 800px;
        height: 500px;
        object-fit: cover;
        object-position: 48% 67%;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="copy">
        <div>
          <p class="eyebrow">Relational normalization</p>
          <h1>SchemaWise</h1>
          <p class="value">
            Analyze schemas. Understand the rules. Compare valid 3NF and BCNF
            transformations.
          </p>
        </div>
        <p class="footer">Deterministic explanations for database students</p>
      </section>
      <section class="product" aria-label="Real SchemaWise product screenshot">
        <div class="browser">
          <div class="bar"><span></span><span></span><span></span></div>
          <img
            src="screenshots/schemawise-editor-analysis.png"
            alt="SchemaWise analyzed schema workspace"
          />
        </div>
      </section>
    </main>
  </body>
</html>
